trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: ml-training
  imageTag: $(Build.BuildId)

steps:

  - checkout: self

  - task: UsePythonVersion@0
    displayName: Use Python 3.12
    inputs:
      versionSpec: "3.12"

  - script: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt
      python -m pip install xgboost
    displayName: Install ML training dependencies

  - script: |
      python -m pytest ml/training/tests -v
    displayName: Run ML training tests

  - task: Docker@2
    displayName: Build ML training Docker image
    inputs:
      command: build
      Dockerfile: ml/training/Dockerfile
      buildContext: .
      repository: $(imageRepository)
      tags: |
        $(imageTag)
        latest

  - script: |
      echo "Running ML training Docker smoke test..."

      docker run --rm \
        $(imageRepository):$(imageTag) \
        python -m ml.training.src.train \
        --help
    displayName: Run Docker smoke test

  - script: |
      echo "Saving Docker image as pipeline artifact..."

      docker save $(imageRepository):$(imageTag) | gzip > $(Build.ArtifactStagingDirectory)/ml-training-$(imageTag).tar.gz

      echo "Docker image saved successfully."

      ls -lh $(Build.ArtifactStagingDirectory)/ml-training-$(imageTag).tar.gz
    displayName: Save Docker image

  - task: PublishPipelineArtifact@1
    displayName: Publish ML training Docker image artifact
    inputs:
      targetPath: "$(Build.ArtifactStagingDirectory)/ml-training-$(imageTag).tar.gz"
      artifact: ml-training-docker-image
      publishLocation: pipeline