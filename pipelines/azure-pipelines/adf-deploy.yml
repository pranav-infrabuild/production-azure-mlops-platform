trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    displayName: "Validate ADF Metadata"

    jobs:
      - job: ValidateADF
        displayName: "Validate ADF Artifacts"

        steps:
          - checkout: self

          - script: |
              echo "Validating ADF metadata..."
              find adf -type f -print
            displayName: "List ADF Artifacts"