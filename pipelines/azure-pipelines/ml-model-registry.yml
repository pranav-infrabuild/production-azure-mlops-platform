trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  modelName: transaction-risk-xgboost
  modelVersion: "1"
  evaluationReport: evaluation_report.json

steps:

  - checkout: self

  - task: UsePythonVersion@0
    displayName: Use Python 3.12
    inputs:
      versionSpec: "3.12"

  - script: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt
    displayName: Install MLflow dependencies

  - script: |
      python -m pytest model_registry/registry/tests -v
    displayName: Run model registry tests

  - script: |
      python -m py_compile model_registry/registry/register_model.py
      python -m py_compile model_registry/registry/promote_model.py
    displayName: Validate registry Python code

  - script: |
      echo "Model registry validation completed."
      echo "Model: $(modelName)"
      echo "Configured version: $(modelVersion)"
      echo "Evaluation report: $(evaluationReport)"
    displayName: Display registry configuration