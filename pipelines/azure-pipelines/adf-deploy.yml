trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: "sc-azure-mlops-dev"
  resourceGroup: "rg-mlops-dev"
  dataFactoryName: "adf-mlops-dev925714"
  subscriptionId: "5ac86695-3a1f-469d-ab77-ae270ca18530"
  apiVersion: "2018-06-01"

stages:

  # ============================================================
  # VALIDATION
  # ============================================================

  - stage: Validate
    displayName: "Validate ADF Metadata"

    jobs:

      - job: ValidateADF
        displayName: "Validate ADF Artifacts"

        steps:

          - checkout: self

          - script: |
              set -e

              echo "========================================"
              echo "Validating ADF metadata files"
              echo "========================================"

              test -f adf/linkedServices/ls-adls-gen2.json
              test -f adf/datasets/ds-adls-raw.json
              test -f adf/datasets/ds-adls-processed.json
              test -f adf/pipelines/pl-ingest-raw-to-processed.json

              echo ""
              echo "ADF metadata files found:"
              find adf -type f -print

              echo ""
              echo "Validating JSON syntax..."

              python -m json.tool \
                adf/linkedServices/ls-adls-gen2.json > /dev/null

              python -m json.tool \
                adf/datasets/ds-adls-raw.json > /dev/null

              python -m json.tool \
                adf/datasets/ds-adls-processed.json > /dev/null

              python -m json.tool \
                adf/pipelines/pl-ingest-raw-to-processed.json > /dev/null

              echo ""
              echo "ADF metadata validation successful."

            displayName: "Validate ADF JSON"


  # ============================================================
  # DEV DEPLOYMENT
  # ============================================================

  - stage: Deploy_Dev
    displayName: "Deploy ADF Metadata - Dev"

    dependsOn: Validate

    condition: succeeded()

    jobs:

      - job: DeployADF
        displayName: "Deploy ADF Metadata"

        steps:

          - checkout: self

          - task: AzureCLI@2
            displayName: "Deploy ADF Metadata via REST API"

            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: bash
              scriptLocation: inlineScript

              inlineScript: |

                set -e

                echo "========================================"
                echo "ADF Metadata Deployment"
                echo "========================================"

                echo ""
                echo "Resource Group : $(resourceGroup)"
                echo "Data Factory   : $(dataFactoryName)"
                echo "Subscription   : $(subscriptionId)"
                echo "API Version    : $(apiVersion)"

                # ====================================================
                # LINKED SERVICE
                # ====================================================

                echo ""
                echo "Preparing linked service payload..."

                jq '{properties: .properties}' \
                  adf/linkedServices/ls-adls-gen2.json \
                  > /tmp/ls-adls-gen2-payload.json

                echo "Deploying linked service..."

                az rest \
                  --method put \
                  --url "https://management.azure.com/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactoryName)/linkedservices/ls-adls-gen2?api-version=$(apiVersion)" \
                  --body @/tmp/ls-adls-gen2-payload.json

                echo "Linked service deployment successful."


                # ====================================================
                # RAW DATASET
                # ====================================================

                echo ""
                echo "Preparing raw dataset payload..."

                jq '{properties: .properties}' \
                  adf/datasets/ds-adls-raw.json \
                  > /tmp/ds-adls-raw-payload.json

                echo "Deploying raw dataset..."

                az rest \
                  --method put \
                  --url "https://management.azure.com/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactoryName)/datasets/ds-adls-raw?api-version=$(apiVersion)" \
                  --body @/tmp/ds-adls-raw-payload.json

                echo "Raw dataset deployment successful."


                # ====================================================
                # PROCESSED DATASET
                # ====================================================

                echo ""
                echo "Preparing processed dataset payload..."

                jq '{properties: .properties}' \
                  adf/datasets/ds-adls-processed.json \
                  > /tmp/ds-adls-processed-payload.json

                echo "Deploying processed dataset..."

                az rest \
                  --method put \
                  --url "https://management.azure.com/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactoryName)/datasets/ds-adls-processed?api-version=$(apiVersion)" \
                  --body @/tmp/ds-adls-processed-payload.json

                echo "Processed dataset deployment successful."


                # ====================================================
                # PIPELINE
                # ====================================================

                echo ""
                echo "Preparing pipeline payload..."

                jq '{properties: .properties}' \
                  adf/pipelines/pl-ingest-raw-to-processed.json \
                  > /tmp/pl-ingest-raw-to-processed-payload.json

                echo "Deploying ADF pipeline..."

                az rest \
                  --method put \
                  --url "https://management.azure.com/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactoryName)/pipelines/pl-ingest-raw-to-processed?api-version=$(apiVersion)" \
                  --body @/tmp/pl-ingest-raw-to-processed-payload.json

                echo "ADF pipeline deployment successful."


                # ====================================================
                # VERIFICATION
                # ====================================================

                echo ""
                echo "========================================"
                echo "Verifying linked service..."
                echo "========================================"

                az rest \
                  --method get \
                  --url "https://management.azure.com/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactoryName)/linkedservices/ls-adls-gen2?api-version=$(apiVersion)" \
                  --query "{name:name,type:properties.type,typeProperties:properties.typeProperties}" \
                  --output json


                echo ""
                echo "========================================"
                echo "Verifying raw dataset..."
                echo "========================================"

                az rest \
                  --method get \
                  --url "https://management.azure.com/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactoryName)/datasets/ds-adls-raw?api-version=$(apiVersion)" \
                  --query "{name:name,type:properties.type,location:properties.typeProperties.location}" \
                  --output json


                echo ""
                echo "========================================"
                echo "Verifying processed dataset..."
                echo "========================================"

                az rest \
                  --method get \
                  --url "https://management.azure.com/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactoryName)/datasets/ds-adls-processed?api-version=$(apiVersion)" \
                  --query "{name:name,type:properties.type,location:properties.typeProperties.location}" \
                  --output json


                echo ""
                echo "========================================"
                echo "Verifying ADF pipeline..."
                echo "========================================"

                az rest \
                  --method get \
                  --url "https://management.azure.com/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactoryName)/pipelines/pl-ingest-raw-to-processed?api-version=$(apiVersion)" \
                  --query "{name:name,description:properties.description,activities:properties.activities[].name}" \
                  --output json


                echo ""
                echo "========================================"
                echo "ADF metadata deployment completed."
                echo "========================================"