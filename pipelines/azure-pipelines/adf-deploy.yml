trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: sc-azure-mlops-dev
  subscriptionId: 5ac86695-3a1f-469d-ab77-ae270ca18530
  resourceGroup: rg-mlops-dev
  dataFactoryName: adf-mlops-dev925714
  apiVersion: 2018-06-01

steps:

  - checkout: self

  - task: AzureCLI@2
    displayName: Deploy ADF Metadata via REST API
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |

        set -euo pipefail

        echo "========================================"
        echo "ADF Metadata Deployment"
        echo "========================================"

        echo "Resource Group : $(resourceGroup)"
        echo "Data Factory   : $(dataFactoryName)"
        echo "Subscription   : $(subscriptionId)"
        echo "API Version    : $(apiVersion)"
        echo ""

        # --------------------------------------------------
        # Validate JSON files
        # --------------------------------------------------

        echo "Validating ADF JSON files..."

        test -f adf/linkedServices/ls_adls_gen2.json
        test -f adf/datasets/ds_adls_raw.json
        test -f adf/datasets/ds_adls_processed.json
        test -f adf/pipelines/pl_ingest_raw_to_processed.json

        jq empty adf/linkedServices/ls_adls_gen2.json
        jq empty adf/datasets/ds_adls_raw.json
        jq empty adf/datasets/ds_adls_processed.json
        jq empty adf/pipelines/pl_ingest_raw_to_processed.json

        echo "All JSON files are valid."
        echo ""

        # --------------------------------------------------
        # Linked Service
        # --------------------------------------------------

        echo "Preparing linked service payload..."

        jq '{properties: .properties}' \
          adf/linkedServices/ls_adls_gen2.json \
          > /tmp/ls-adls-gen2-payload.json

        echo "Deploying linked service..."

        az rest \
          --method put \
          --url "https://management.azure.com/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactoryName)/linkedservices/ls-adls-gen2?api-version=$(apiVersion)" \
          --body @/tmp/ls-adls-gen2-payload.json

        echo "Linked service deployment successful."
        echo ""

        # --------------------------------------------------
        # Raw Dataset
        # --------------------------------------------------

        echo "Preparing raw dataset payload..."

        jq '{properties: .properties}' \
          adf/datasets/ds_adls_raw.json \
          > /tmp/ds-adls-raw-payload.json

        echo "Deploying raw dataset..."

        az rest \
          --method put \
          --url "https://management.azure.com/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactoryName)/datasets/ds_adls_raw?api-version=$(apiVersion)" \
          --body @/tmp/ds-adls-raw-payload.json

        echo "Raw dataset deployment successful."
        echo ""

        # --------------------------------------------------
        # Processed Dataset
        # --------------------------------------------------

        echo "Preparing processed dataset payload..."

        jq '{properties: .properties}' \
          adf/datasets/ds_adls_processed.json \
          > /tmp/ds-adls-processed-payload.json

        echo "Deploying processed dataset..."

        az rest \
          --method put \
          --url "https://management.azure.com/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactoryName)/datasets/ds_adls_processed?api-version=$(apiVersion)" \
          --body @/tmp/ds-adls-processed-payload.json

        echo "Processed dataset deployment successful."
        echo ""

        # --------------------------------------------------
        # Pipeline
        # --------------------------------------------------

        echo "Preparing pipeline payload..."

        jq '{properties: .properties}' \
          adf/pipelines/pl_ingest_raw_to_processed.json \
          > /tmp/pl-ingest-raw-to-processed-payload.json

        echo "Deploying ADF pipeline..."

        az rest \
          --method put \
          --url "https://management.azure.com/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactoryName)/pipelines/pl_ingest_raw_to_processed?api-version=$(apiVersion)" \
          --body @/tmp/pl-ingest-raw-to-processed-payload.json

        echo "ADF pipeline deployment successful."
        echo ""

        # --------------------------------------------------
        # Verification
        # --------------------------------------------------

        echo "========================================"
        echo "Verifying ADF resources"
        echo "========================================"

        echo ""
        echo "Verifying linked service..."

        az rest \
          --method get \
          --url "https://management.azure.com/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactoryName)/linkedservices/ls-adls-gen2?api-version=$(apiVersion)" \
          --query "{name:name,type:type}"

        echo ""
        echo "Verifying raw dataset..."

        az rest \
          --method get \
          --url "https://management.azure.com/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactoryName)/datasets/ds_adls_raw?api-version=$(apiVersion)" \
          --query "{name:name,type:type}"

        echo ""
        echo "Verifying processed dataset..."

        az rest \
          --method get \
          --url "https://management.azure.com/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactoryName)/datasets/ds_adls_processed?api-version=$(apiVersion)" \
          --query "{name:name,type:type}"

        echo ""
        echo "Verifying pipeline..."

        az rest \
          --method get \
          --url "https://management.azure.com/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactoryName)/pipelines/pl_ingest_raw_to_processed?api-version=$(apiVersion)" \
          --query "{name:name,type:type}"

        echo ""
        echo "========================================"
        echo "ADF Metadata Deployment Completed"
        echo "========================================"